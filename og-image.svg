<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="1110" cy="571" r="76" fill="#880e4f" opacity="0.13"/>
    <circle cx="906" cy="387" r="68" fill="#880e4f" opacity="0.15"/>
    <circle cx="768" cy="330" r="81" fill="#880e4f" opacity="0.14"/>
    <circle cx="935" cy="527" r="58" fill="#880e4f" opacity="0.17"/>
    <circle cx="-14" cy="104" r="30" fill="#880e4f" opacity="0.11"/>
    <circle cx="386" cy="269" r="53" fill="#880e4f" opacity="0.08"/>
    <rect x="1206" y="350" width="54" height="59" rx="8" fill="#b71c1c" opacity="0.07" transform="rotate(26, 988, 513)"/>
    <rect x="895" y="286" width="60" height="23" rx="8" fill="#b71c1c" opacity="0.05" transform="rotate(29, -65, 106)"/>
    <rect x="182" y="463" width="47" height="52" rx="8" fill="#b71c1c" opacity="0.12" transform="rotate(9, 233, 113)"/>
    <rect x="116" y="-88" width="45" height="65" rx="8" fill="#b71c1c" opacity="0.08" transform="rotate(32, 728, 654)"/>
    <rect x="31" y="68" width="72" height="50" rx="8" fill="#b71c1c" opacity="0.10" transform="rotate(27, 1150, 464)"/>
    <rect x="894" y="151" width="40" height="70" rx="8" fill="#b71c1c" opacity="0.10" transform="rotate(28, 729, 682)"/>
    <rect x="1219" y="447" width="95" height="85" rx="8" fill="#b71c1c" opacity="0.05" transform="rotate(30, 11, 162)"/>
    <rect x="468" y="-78" width="46" height="54" rx="8" fill="#b71c1c" opacity="0.11" transform="rotate(1, 1093, 202)"/>
    <polygon points="387,364 420,430 354,430" fill="#880e4f" opacity="0.09"/>
    <polygon points="351,601 437,773 265,773" fill="#880e4f" opacity="0.07"/>
    <polygon points="937,232 983,324 891,324" fill="#880e4f" opacity="0.06"/>
    <polygon points="1219,659 1264,749 1174,749" fill="#880e4f" opacity="0.13"/>

  <!-- Wave at bottom -->
  <path d="M0,586 C360,608 840,564 1200,586 L1200,630 L0,630Z" fill="#880e4f" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 셔츠룸 대표 실장 견적 테이블
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 셔츠룸
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#ffd600" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#ffd600" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 마포 셔츠룸 대표 실장 견적 테이블 — 셔츠룸
  </text>
</svg>